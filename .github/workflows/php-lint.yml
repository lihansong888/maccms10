name: PHP syntax check

on:
  push:
    branches:
      - security-hardening
  pull_request:
    branches:
      - security-hardening

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Lint PHP source
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' \
            -not -path './.git/*' \
            -not -path './runtime/*' \
            -not -path './application/data/*' \
            -not -path './vendor/*' \
            -not -path './thinkphp/*' \
            -print0)

      - name: Regression test admin CSRF protection
        run: php tests/regression/admin_write_csrf.php

      - name: Regression test collection SSRF protection
        run: php tests/regression/collect_probe_safety.php

      - name: Regression test API list limits
        run: php tests/regression/api_num_clamp.php

      - name: Regression test request-path database safety
        run: php tests/regression/no_request_ddl.php

      - name: Regression test user registration validation
        run: php tests/regression/user_register_validate.php

      - name: Regression test card redemption transactions
        run: php tests/regression/card_redemption_transaction.php

      - name: Regression test local player loading pages
        run: php tests/regression/player_loading_local.php

      - name: Regression test TVBox configuration
        run: php tests/regression/tvbox_config.php
