name: PHP syntax check

on:
  push:
    branches:
      - security-hardening
  pull_request:
    branches:
      - security-hardening

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Lint PHP source
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' \
            -not -path './.git/*' \
            -not -path './runtime/*' \
            -not -path './application/data/*' \
            -not -path './vendor/*' \
            -not -path './thinkphp/*' \
            -print0)
