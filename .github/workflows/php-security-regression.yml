name: PHP Security Regression

on:
  push:
    branches:
      - security-audit-clean
  pull_request:
    branches:
      - master

jobs:
  php-security-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax checks
        run: |
          php -l application/common/model/Collect.php
          php -l application/common/model/Card.php
          php -l application/admin/controller/Template.php
          php -l application/common/model/Website.php
          php -l application/common/model/Actor.php
          php -l application/admin/controller/Cash.php
          php -l application/admin/controller/User.php
          php -l application/index/controller/Comment.php
          php -l tests/regression/ssrf_collection.php
          php -l tests/regression/card_redemption_transaction.php
          php -l tests/regression/template_path_safety.php
          php -l tests/regression/sql_order_injection.php
          php -l tests/regression/template_expression_safety.php
          php -l tests/regression/admin_write_csrf.php
          php -l tests/regression/comment_mass_assignment.php
      - name: Collection SSRF regression
        run: php tests/regression/ssrf_collection.php
      - name: Card redemption regression
        run: php tests/regression/card_redemption_transaction.php
      - name: Template path regression
        run: php tests/regression/template_path_safety.php
      - name: SQL order injection regression
        run: php tests/regression/sql_order_injection.php
      - name: Template expression injection regression
        run: php tests/regression/template_expression_safety.php
      - name: Admin CSRF regression
        run: php tests/regression/admin_write_csrf.php
      - name: Public comment mass assignment regression
        run: php tests/regression/comment_mass_assignment.php
